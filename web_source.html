<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM - MATRIX</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:'Courier New', monospace;padding:8px;position:relative;overflow:hidden
    }
    #matrixCanvas{
      position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.4;pointer-events:none
    }
    .glitch-overlay{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:repeating-linear-gradient(0deg,rgba(0,255,0,.03) 0px,rgba(0,0,0,.3) 1px,transparent 2px,transparent 4px);
      pointer-events:none;z-index:2;animation:scan 10s linear infinite
    }
    @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(20px)}}
    .glitch-flash{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:linear-gradient(90deg,transparent 50%,rgba(0,255,0,.02) 50%);
      background-size:4px 100%;
      pointer-events:none;z-index:3;animation:glitchMove .2s infinite;opacity:.2
    }
    @keyframes glitchMove{0%,100%{transform:translateX(0)}25%{transform:translateX(2px)}75%{transform:translateX(-2px)}}
    .box{
      max-width:500px;width:100%;background:#0a100a;border:2px solid #2ecc2e;padding:15px;border-radius:12px;
      box-shadow:0 0 50px #0f0, inset 0 0 20px #0a0;position:relative;z-index:10;backdrop-filter:blur(1px);
      animation:boxFlicker 5s infinite
    }
    @keyframes boxFlicker{
      0%,100%{opacity:.95}92%{opacity:.95}93%{opacity:.7}94%{opacity:.95}95%{opacity:.5}96%{opacity:.95}
    }
    .box::after{
      content:"";position:absolute;top:0;left:0;width:100%;height:100%;
      background:linear-gradient(rgba(0,255,0,.07) 50%,rgba(0,0,0,.1) 50%);background-size:100% 4px;
      border-radius:12px;pointer-events:none;z-index:1
    }
    .domain{
      color:#2ecc2e;font-size:14px;border-bottom:1px dashed #2ecc2e;padding-bottom:6px;margin-bottom:10px;
      text-shadow:0 0 8px #0f0;position:relative;overflow:hidden;animation:typing 3s steps(30);
      white-space:nowrap
    }
    @keyframes typing{from{width:0}to{width:100%}}
    .title{
      font-size:28px;font-weight:700;color:#adffad;text-shadow:0 0 12px #0f0;line-height:1.1;position:relative;
      animation:glitchText 3s infinite
    }
    @keyframes glitchText{
      0%,100%{transform:skew(0,0);text-shadow:0 0 12px #0f0}
      95%{transform:skew(3deg,1deg);text-shadow:-3px 0 #0ff, 3px 0 #0f0}
      96%{transform:skew(-3deg,-1deg);text-shadow:3px 0 #0ff, -3px 0 #0f0}
    }
    .sub{
      font-size:16px;color:#2ecc2e;margin:4px 0 12px;border-left:3px solid #2ecc2e;padding-left:10px;
      text-shadow:0 0 10px #0f0;animation:blink 2s infinite
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.7}}
    .info{
      background:#0a150a;border:1px solid #2ecc2e;border-radius:8px;padding:12px;margin:12px 0;
      box-shadow:inset 0 0 20px #0f0, 0 0 15px #0f0;position:relative
    }
    .row{
      display:flex;align-items:baseline;font-size:14px;margin-bottom:8px;color:#adffad;border-bottom:1px dotted #2ecc2e;
      padding-bottom:5px;position:relative;transition:.2s
    }
    .row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
    .row:hover{background:rgba(0,255,0,.15);transform:translateX(2px)}
    .tag{color:#2ecc2e;min-width:80px;font-weight:600;text-shadow:0 0 8px #0f0}
    .isi{
      color:#ffaa66;background:#102010;padding:2px 10px;border-radius:16px;margin-left:8px;font-size:13px;
      border:1px solid #2ecc2e;box-shadow:0 0 12px #0f0;animation:borderPulse 2s infinite
    }
    @keyframes borderPulse{0%,100%{border-color:#2ecc2e;box-shadow:0 0 12px #0f0}50%{border-color:#0f0;box-shadow:0 0 25px #0f0}}
    .list{margin-top:15px}
    .item{
      color:#a5f0a5;font-size:14px;margin-bottom:6px;border-left:3px solid #2ecc2e;padding-left:12px;
      background:linear-gradient(90deg,#102010,transparent);position:relative;overflow:hidden;
      animation:slideIn .5s ease-out;text-shadow:0 0 8px #0f0;transition:.2s
    }
    @keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
    .item:hover{background:#1a3a1a;border-left-width:6px;transform:scale(1.02)}
    .cursor{
      display:inline-block;width:8px;height:14px;background:#0f0;margin-left:5px;animation:cursorBlink 1s infinite;
      box-shadow:0 0 10px #0f0
    }
    @keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
    .command-line{
      color:#2ecc2e;font-size:11px;margin-top:12px;border-top:1px dashed #2ecc2e;padding-top:8px;text-align:right;
      text-shadow:0 0 5px #0f0;animation:commandPulse 3s infinite
    }
    @keyframes commandPulse{0%,100%{opacity:1}50%{opacity:.7}}
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  <div class="glitch-overlay"></div>
  <div class="glitch-flash"></div>

  <div class="box">
    <div class="domain">system.panel.local<span class="cursor"></span></div>
    <div class="title">SYSTEM - MATRIX</div>
    <div class="sub">UI THEME ENABLED</div>

    <div class="info">
      <div class="row"><span class="tag">SERVER :</span><span class="isi">ONLINE</span></div>
      <div class="row"><span class="tag">STATUS :</span><span class="isi">RUNNING</span></div>
      <div class="row"><span class="tag">SECURITY :</span><span class="isi">ACTIVE</span></div>
      <div class="row"><span class="tag">MODE :</span><span class="isi">MATRIX</span></div>
    </div>

    <div class="list">
      <div class="item">- Visual: Matrix Rain</div>
      <div class="item">- Overlay: Scanlines</div>
      <div class="item">- Effect: Glitch</div>
      <div class="item">- Theme: Dark Terminal</div>
    </div>

    <div class="command-line">
      root@panel:~# echo "theme enabled" <span class="cursor"></span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // NOTE: backtick (\`) dihapus biar aman di template literal JS
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+{}[]|;:,.<>?/\\\\~';
    const charsArray = chars.split('');

    const fontSize = 14;
    const columns = canvas.width / fontSize;

    const drops = [];
    for (let i = 0; i < columns; i++) drops[i] = Math.random() * -100;

    const speeds = [];
    for (let i = 0; i < columns; i++) speeds[i] = 0.5 + Math.random() * 3;

    const columnChars = [];
    for (let i = 0; i < columns; i++) {
      columnChars[i] = [];
      for (let j = 0; j < 20; j++) {
        columnChars[i][j] = charsArray[Math.floor(Math.random() * charsArray.length)];
      }
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        for (let j = 0; j < 6; j++) {
          const y = drops[i] - j * fontSize;
          if (y > 0 && y < canvas.height) {
            const ch = columnChars[i][Math.floor(Math.random() * columnChars[i].length)];
            if (j === 0) { ctx.fillStyle = '#afffaf'; ctx.shadowBlur = 15; ctx.shadowColor = '#0f0'; }
            else if (j === 1) { ctx.fillStyle = '#7fff7f'; ctx.shadowBlur = 10; }
            else if (j === 2) { ctx.fillStyle = '#3fbf3f'; ctx.shadowBlur = 5; }
            else { ctx.fillStyle = '#1f7f1f'; ctx.shadowBlur = 2; }
            ctx.fillText(ch, i * fontSize, y);
            ctx.shadowBlur = 0;
          }
        }

        drops[i] += speeds[i];
        if (drops[i] > canvas.height + 100) {
          drops[i] = Math.random() * -200;
          speeds[i] = 0.5 + Math.random() * 3;
        }
        if (Math.random() < 0.001) drops[i] = Math.random() * -300;
      }
      requestAnimationFrame(drawMatrix);
    }
    drawMatrix();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    setInterval(() => {
      if (Math.random() > 0.7) {
        document.querySelector('.glitch-flash').style.opacity = '0.4';
        setTimeout(() => document.querySelector('.glitch-flash').style.opacity = '0.2', 50);
      }
    }, 500);

    setInterval(() => {
      if (Math.random() > 0.8) {
        const box = document.querySelector('.box');
        box.style.transform = 'translateX(' + (Math.random() * 4 - 2) + 'px)';
        setTimeout(() => box.style.transform = 'translateX(0)', 50);
      }
    }, 800);

    setInterval(() => {
      for (let i = 0; i < columnChars.length; i++) {
        if (Math.random() > 0.9) {
          for (let j = 0; j < columnChars[i].length; j++) {
            columnChars[i][j] = charsArray[Math.floor(Math.random() * charsArray.length)];
          }
        }
      }
    }, 2000);
  </script>
</body>
</html>
